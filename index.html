<!doctype html>
<html lang="ja" data-theme="dark" data-accent="cyan" data-fx="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XEVARIX">
<meta name="theme-color" content="#01084d">
<meta name="description" content="XEVARIX — NGX と ISHIDA Production がつくる、アプリの形をした OS。">
<meta name="format-detection" content="telephone=no">
<title>XEVARIX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/brand/icon-64.png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<style>
/* 起動画面（ほかの CSS が届く前に、すぐ出す） */
html, body { margin: 0; height: 100%; background: #01084d; }
#xvx-boot { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 40%, #011c82 0%, #01084d 70%); color: #eef4ff; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
#xvx-boot .bt { display: grid; justify-items: center; gap: 14px; padding: 20px; text-align: center; }
#xvx-boot img { width: min(56vw, 250px); height: auto; aspect-ratio: 1; border-radius: 22%; box-shadow: 0 20px 60px rgba(0, 20, 120, .55); }
#xvx-boot .bar { width: min(52vw, 220px); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; margin-top: 10px; }
#xvx-boot .bar i { display: block; width: 4%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #0a84ff, #38e6fd); transition: width .25s ease; }
#xvx-boot .msg { font-size: 12px; color: #aebde6; min-height: 1.4em; }
#xvx-boot .by { font-size: 11px; letter-spacing: .14em; color: #7688bd; margin-top: 6px; }
#xvx-boot .fail { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 440px; }
#xvx-boot.failed .fail { display: flex; }
#xvx-boot .fail button { height: 38px; padding: 0 16px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff; font: inherit; font-weight: 600; font-size: 14px; }
#xvx-boot pre { display: none; max-width: min(86vw, 520px); max-height: 30vh; overflow: auto; text-align: left; font-size: 11px; color: #ffb0ba; white-space: pre-wrap; margin: 0; }
#xvx-boot.failed pre { display: block; }
</style>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/wm.css">
</head>
<body>
<div id="xvx-wall" data-wall="aurora"><div class="wl"></div><div class="wg a"></div><div class="wg b"></div></div>
<main id="xvx-desk" aria-label="ホーム"></main>
<div id="xvx-stage" aria-label="アプリの窓"></div>
<header id="xvx-status" class="glass" aria-label="ステータスバー"></header>
<nav id="xvx-dock" class="glass" aria-label="ドック"></nav>
<div id="xvx-layer"></div>
<div id="xvx-toasts" aria-live="polite"></div>
<div id="xvx-lock" aria-label="ロック画面"></div>
<div id="xvx-dim"></div>
<div id="xvx-boot" role="status">
  <div class="bt">
    <img src="assets/brand/xevarix-logo-640.webp" alt="XEVARIX" width="250" height="250">
    <div class="bar"><i id="xvx-boot-bar"></i></div>
    <div class="msg" id="xvx-boot-msg">起動しています…</div>
    <pre id="xvx-boot-err"></pre>
    <div class="fail">
      <button type="button" onclick="location.reload()">もう一度起動する</button>
      <button type="button" onclick="location.href=location.pathname+'?safe=1'">セーフモードで起動する</button>
    </div>
    <div class="by">NGX × ISHIDA Production</div>
  </div>
</div>
<noscript><div style="position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#01084d;color:#fff;padding:24px;text-align:center">XEVARIX を使うには、ブラウザの JavaScript をオンにしてください。</div></noscript>
<script>
/* 起動が終わらなかったときの見張り（本体のスクリプトが読めなかった場合も含む） */
(function () {
  var errs = [];
  window.addEventListener('error', function (e) { errs.push((e.message || 'エラー') + (e.filename ? '\n  ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); }, true);
  function fail() {
    if (window.__xvxBooted) return;
    var b = document.getElementById('xvx-boot'); if (!b) return;
    b.classList.add('failed');
    var m = document.getElementById('xvx-boot-msg'); if (m) m.textContent = '起動できませんでした';
    var p = document.getElementById('xvx-boot-err'); if (p) p.textContent = (window.__xvxBootError || '') + (errs.length ? '\n' + errs.slice(0, 4).join('\n') : '');
  }
  document.addEventListener('xvx-boot-failed', fail);
  setTimeout(function () { if (!window.__xvxBooted && !document.querySelector('.xo') && !document.querySelector('#xvx-lock.on')) fail(); }, 15000);
})();
</script>
<script type="module" src="sys/main.js"></script>
</body>
</html>
